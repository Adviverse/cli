version: 2
project_name: adviverse
builds:
  - main: .
    binary: adviverse
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X github.com/Adviverse/cli/internal/cmd.Version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: "adviverse_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"
# Homebrew tap is a follow-up: needs the Adviverse/homebrew-tap repo + HOMEBREW_TAP_GITHUB_TOKEN. Distribution is via install.sh for now.
